server:
  port: 8080

spring:
  application:
    name: qlexpress-demo
  datasource:
    url: jdbc:mysql://localhost:3306/security_rule_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: your_mysql_password_here
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  main:
    allow-circular-references: true

logging:
  level:
    com.demo: DEBUG
    org.hibernate.SQL: DEBUG